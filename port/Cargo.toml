[package]
name = "xf"
version = "0.1.0"
edition = "2021"
description = "X-Files Game (VirtualCinema) port: HDB reader + headless engine core built on trace-confirmed rules"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["sdl"]
# SDL2 front-end (bin `xf`); `cargo test --no-default-features` builds without SDL
sdl = ["dep:sdl2", "dep:gl"]
# release builds (CI): compile the SDL2 source shipped in the sdl2-sys crate with cmake and link it statically, so the
# binary needs no SDL2 library or pkg-config on the user's machine (SDL2 is Zlib-licensed, see LICENSE-THIRD-PARTY).
# With CMake >= 4 set CMAKE_POLICY_VERSION_MINIMUM=3.5 (SDL 2.26's CMakeLists is older); .github/scripts/package.sh does.
sdl-bundled = ["sdl", "sdl2/bundled", "sdl2/static-link"]

[dependencies]
serde_json = "1"
jpeg-decoder = { version = "0.3", default-features = false }
sdl2 = { version = "0.37", optional = true, features = ["use-pkgconfig"] }
skrifa = "0.48.0"
# OpenGL 3.3 bindings for the window's upscaler (src/gpu/gl.rs: FSR 1.0 / linear / nearest)
gl = { version = "=0.14.0", optional = true }

[[bin]]
name = "xf"
path = "src/bin/xf.rs"
required-features = ["sdl"]

[[example]]
name = "fsr"
required-features = ["sdl"]

[profile.release]
debug = false

[profile.dev.package."*"]
opt-level = 3
