[package]
name = "xf-web"
version = "0.1.0"
edition = "2021"
description = "X-Files port, web front: the core (Session) compiled to wasm32-unknown-unknown, run in a Web Worker"
license = "MIT OR Apache-2.0"
publish = false

# standalone: not a member of any workspace above
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
xf = { path = "..", default-features = false }

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
